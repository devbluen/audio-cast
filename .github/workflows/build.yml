name: Build AudioCast

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to embed in the build"
        required: false
        type: string
        default: "1.0.0"
      publish_release:
        description: "Publish a GitHub release (tag v<version>) with both zips"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.version || '1.0.0' }}

jobs:
  # One job per platform, each with its own artifact, so players download only
  # the one their server needs. Both run on Windows exactly like a developer
  # machine does: Windows natively, Linux cross-compiled with Zig.
  release:
    name: ${{ matrix.platform }} x86 (build.ps1)
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [windows, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: ./build.ps1 -Target ${{ matrix.platform }} -Version $env:RELEASE_VERSION

      # The artifact is already a zip; upload the release zip's contents so the
      # download is not a zip inside a zip.
      - name: Extract release files
        shell: pwsh
        run: Expand-Archive -Path "dist/audio-cast-$env:RELEASE_VERSION-${{ matrix.platform }}-x86.zip" -DestinationPath package

      - uses: actions/upload-artifact@v4
        with:
          name: audio-cast-${{ env.RELEASE_VERSION }}-${{ matrix.platform }}-x86
          path: package/
          if-no-files-found: error

  # The cross-compiled Linux binaries cannot run on Windows, so the tests also
  # run on a real 32-bit Linux build.
  linux-tests:
    name: Linux x86 tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib g++-multilib cmake ninja-build

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAUDIOCAST_BUILD_32BIT=ON
          cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Verify exports
        run: |
          plugin=build/plugins/audio-cast.so
          file "$plugin"
          for symbol in ComponentEntryPoint Supports Load Unload AmxLoad AmxUnload ProcessTick; do
            nm -D --defined-only "$plugin" | grep -qw "$symbol"
          done

  # Only on a manual run with "publish_release" checked, and only after both
  # platforms built and the Linux tests passed.
  publish:
    name: Publish release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: [release, linux-tests]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: audio-cast-${{ env.RELEASE_VERSION }}-*
          path: artifacts

      # Each artifact holds the extracted release files; zip them again as
      # release assets.
      - name: Create zips
        run: |
          mkdir release
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            (cd "$dir" && zip -qr "$GITHUB_WORKSPACE/release/$name.zip" .)
          done
          ls -l release

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$RELEASE_VERSION" release/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AudioCast $RELEASE_VERSION" \
            --generate-notes
